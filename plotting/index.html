<!DOCTYPE html>
<html>
<head>
    <title>Diffusion Comparison</title>
    <script type="module" src="plotting.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 5px;
            padding: 0px;
        }
        h1 {
            text-align: center;
        }
        .plots-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0px;
            justify-content: center;
        }
        #numerical-plot-random, #analytic-plot-random, #comparison-plot-random,
        #log-comparison-plot-random, #effective-plot-random,
        #difference-effective-analytic-plot-random,
        #log-difference-effective-analytic-plot-random,
        #difference-ignoring-sources-plot-random, #rms-error-plot-random,
        #numerical-plot-article2d, #analytic-plot-article2d, #comparison-plot-article2d,
        #log-comparison-plot-article2d, #effective-plot-article2d,
        #difference-effective-analytic-plot-article2d,
        #log-difference-effective-analytic-plot-article2d,
        #difference-ignoring-sources-plot-article2d, #rms-error-plot-article2d {
            flex: 1 1 calc(33.333% - 20px); /* Three columns */
            min-width: 300px; /* Minimum width before wrapping */
            height: 500px;
        }
    </style>
</head>
<body>
    <div class="plots-container">
        <div id="numerical-plot-random"></div>
        <div id="analytic-plot-random"></div>
        <div id="effective-plot-random"></div>
        <div id="comparison-plot-random"></div>
        <div id="log-comparison-plot-random"></div>
        <div id="difference-effective-analytic-plot-random"></div>
        <div id="rms-error-plot-random"></div>
        <div id="log-difference-effective-analytic-plot-random"></div>
        <div id="difference-ignoring-sources-plot-random"></div>
        <div id="numerical-plot-article2d"></div>
        <div id="analytic-plot-article2d"></div>
        <div id="effective-plot-article2d"></div>
        <div id="comparison-plot-article2d"></div>
        <div id="log-comparison-plot-article2d"></div>
        <div id="difference-effective-analytic-plot-article2d"></div>
        <div id="rms-error-plot-article2d"></div>
        <div id="log-difference-effective-analytic-plot-article2d"></div>
        <div id="difference-ignoring-sources-plot-article2d"></div>
    </div>
</body>
</html>
